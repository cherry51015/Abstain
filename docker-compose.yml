services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: abstain
      POSTGRES_USER: abstain
      POSTGRES_PASSWORD: abstain
    volumes:
      - abstain_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abstain -d abstain"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://abstain:abstain@db:5432/abstain
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  abstain_pgdata:
