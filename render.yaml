# Render blueprint: API + managed Postgres on the free tier.
services:
  - type: web
    name: abstain-api
    runtime: docker
    plan: free
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: abstain-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MODEL
        value: qwen/qwen3.8-27b
      - key: LLM_EXTRA_BODY
        value: "{}"
      - key: LLM_RPM
        value: "6"
      - key: EXTRACTION_MODE
        value: cascade
      - key: CORS_ORIGINS
        value: https://abstain-kappa.vercel.app

databases:
  - name: abstain-db
    plan: free
